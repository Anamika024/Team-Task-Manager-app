spring.application.name=team-task-manager
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:team_task_manager}
spring.datasource.username=${PGUSER:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
